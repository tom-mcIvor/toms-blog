<svg width="16" height="16" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bulletGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1d4ed8;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Main bullet circle -->
  <circle cx="8" cy="8" r="6" fill="url(#bulletGradient)" />
  
  <!-- Inner highlight -->
  <circle cx="8" cy="8" r="4" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="1" />
  
  <!-- Center dot -->
  <circle cx="8" cy="8" r="2" fill="rgba(255,255,255,0.9)" />
</svg>