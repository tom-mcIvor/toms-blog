<svg width="800" height="400" viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradient definitions -->
    <linearGradient id="primaryGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="secondaryGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f093fb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f5576c;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4facfe;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00f2fe;stop-opacity:1" />
    </linearGradient>
    
    <!-- Glow filter -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Animation definitions -->
    <animateTransform id="rotate" attributeName="transform" type="rotate" values="0 400 200;360 400 200" dur="20s" repeatCount="indefinite"/>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="400" fill="url(#primaryGradient)" opacity="0.1"/>
  
  <!-- Floating geometric shapes -->
  <g opacity="0.3">
    <!-- Hexagons -->
    <polygon points="100,50 130,70 130,110 100,130 70,110 70,70" fill="url(#accentGradient)" opacity="0.6">
      <animateTransform attributeName="transform" type="rotate" values="0 100 90;360 100 90" dur="15s" repeatCount="indefinite"/>
    </polygon>
    
    <polygon points="650,80 680,100 680,140 650,160 620,140 620,100" fill="url(#secondaryGradient)" opacity="0.5">
      <animateTransform attributeName="transform" type="rotate" values="360 650 120;0 650 120" dur="18s" repeatCount="indefinite"/>
    </polygon>
    
    <!-- Circles -->
    <circle cx="200" cy="320" r="25" fill="url(#accentGradient)" opacity="0.4">
      <animate attributeName="r" values="25;35;25" dur="4s" repeatCount="indefinite"/>
    </circle>
    
    <circle cx="700" cy="300" r="20" fill="url(#primaryGradient)" opacity="0.5">
      <animate attributeName="r" values="20;30;20" dur="3s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- Code brackets and symbols -->
  <g fill="url(#primaryGradient)" opacity="0.6" filter="url(#glow)">
    <!-- Opening bracket -->
    <path d="M 50 150 Q 30 150 30 170 L 30 230 Q 30 250 50 250" stroke="url(#primaryGradient)" stroke-width="4" fill="none"/>
    
    <!-- Closing bracket -->
    <path d="M 750 150 Q 770 150 770 170 L 770 230 Q 770 250 750 250" stroke="url(#primaryGradient)" stroke-width="4" fill="none"/>
    
    <!-- Forward slashes -->
    <line x1="120" y1="180" x2="140" y2="220" stroke="url(#accentGradient)" stroke-width="3" opacity="0.7"/>
    <line x1="660" y1="180" x2="680" y2="220" stroke="url(#accentGradient)" stroke-width="3" opacity="0.7"/>
    
    <!-- Semicolons -->
    <circle cx="180" cy="280" r="3" fill="url(#secondaryGradient)"/>
    <path d="M 180 285 Q 175 290 180 295" stroke="url(#secondaryGradient)" stroke-width="2" fill="none"/>
    
    <circle cx="620" cy="280" r="3" fill="url(#secondaryGradient)"/>
    <path d="M 620 285 Q 615 290 620 295" stroke="url(#secondaryGradient)" stroke-width="2" fill="none"/>
  </g>
  
  <!-- Central tech icons area -->
  <g transform="translate(400, 200)">
    <!-- CPU/Chip representation -->
    <rect x="-60" y="-40" width="120" height="80" rx="8" fill="url(#primaryGradient)" opacity="0.3"/>
    <rect x="-50" y="-30" width="100" height="60" rx="4" fill="none" stroke="url(#accentGradient)" stroke-width="2" opacity="0.6"/>
    
    <!-- Circuit lines -->
    <g stroke="url(#accentGradient)" stroke-width="1.5" opacity="0.5">
      <line x1="-40" y1="-20" x2="40" y2="-20"/>
      <line x1="-40" y1="0" x2="40" y2="0"/>
      <line x1="-40" y1="20" x2="40" y2="20"/>
      <line x1="-20" y1="-30" x2="-20" y2="30"/>
      <line x1="0" y1="-30" x2="0" y2="30"/>
      <line x1="20" y1="-30" x2="20" y2="30"/>
    </g>
    
    <!-- Connection dots -->
    <circle cx="-20" cy="-20" r="2" fill="url(#secondaryGradient)"/>
    <circle cx="0" cy="0" r="2" fill="url(#secondaryGradient)"/>
    <circle cx="20" cy="20" r="2" fill="url(#secondaryGradient)"/>
  </g>
  
  <!-- Binary code pattern -->
  <g font-family="monospace" font-size="12" fill="url(#primaryGradient)" opacity="0.2">
    <text x="100" y="100">01001000 01100101 01101100 01101100 01101111</text>
    <text x="150" y="350">01010111 01101111 01110010 01101100 01100100</text>
  </g>
  
  <!-- Floating particles -->
  <g opacity="0.4">
    <circle cx="300" cy="100" r="2" fill="url(#accentGradient)">
      <animate attributeName="cy" values="100;120;100" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="500" cy="350" r="1.5" fill="url(#secondaryGradient)">
      <animate attributeName="cy" values="350;330;350" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="150" cy="250" r="1" fill="url(#primaryGradient)">
      <animate attributeName="cx" values="150;170;150" dur="5s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- Network connection lines -->
  <g stroke="url(#accentGradient)" stroke-width="1" opacity="0.3" fill="none">
    <path d="M 100 200 Q 200 150 300 200 T 500 200">
      <animate attributeName="stroke-dasharray" values="0,1000;1000,0" dur="8s" repeatCount="indefinite"/>
    </path>
    <path d="M 200 100 Q 300 200 400 100 T 600 100">
      <animate attributeName="stroke-dasharray" values="1000,0;0,1000" dur="10s" repeatCount="indefinite"/>
    </path>
  </g>
  
  <!-- Skills text (optional, can be removed if using as background) -->
  <text x="400" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="url(#primaryGradient)" opacity="0.8">
    My Skills
  </text>
</svg>