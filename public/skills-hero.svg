<svg width="600" height="300" viewBox="0 0 600 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Advanced gradient definitions -->
    <linearGradient id="heroGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#764ba2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f093fb;stop-opacity:1" />
    </linearGradient>
    
    <radialGradient id="glowGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#4facfe;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#00f2fe;stop-opacity:0.2" />
    </radialGradient>
    
    <linearGradient id="codeGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff6b6b;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#4ecdc4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#45b7d1;stop-opacity:1" />
    </linearGradient>
    
    <!-- Enhanced glow filter -->
    <filter id="enhancedGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Drop shadow filter -->
    <filter id="dropShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background with animated gradient -->
  <rect width="600" height="300" fill="url(#glowGradient)" opacity="0.1">
    <animate attributeName="opacity" values="0.1;0.2;0.1" dur="4s" repeatCount="indefinite"/>
  </rect>
  
  <!-- Central brain/network representing skills -->
  <g transform="translate(300, 150)">
    <!-- Main brain outline -->
    <path d="M -80 -40 Q -90 -60 -70 -70 Q -40 -80 -10 -75 Q 20 -80 50 -70 Q 80 -60 85 -30 Q 90 0 80 30 Q 70 50 40 60 Q 10 65 -20 60 Q -50 55 -70 40 Q -85 20 -80 -40 Z" 
          fill="url(#heroGradient)" 
          opacity="0.3" 
          filter="url(#enhancedGlow)">
      <animate attributeName="opacity" values="0.3;0.5;0.3" dur="3s" repeatCount="indefinite"/>
    </path>
    
    <!-- Neural network connections -->
    <g stroke="url(#codeGradient)" stroke-width="2" fill="none" opacity="0.6">
      <!-- Main connections -->
      <path d="M -60 -20 Q -30 -40 0 -20 Q 30 -40 60 -20">
        <animate attributeName="stroke-dasharray" values="0,200;200,0" dur="6s" repeatCount="indefinite"/>
      </path>
      <path d="M -50 0 Q 0 -30 50 0">
        <animate attributeName="stroke-dasharray" values="200,0;0,200" dur="5s" repeatCount="indefinite"/>
      </path>
      <path d="M -60 20 Q -30 40 0 20 Q 30 40 60 20">
        <animate attributeName="stroke-dasharray" values="0,200;200,0" dur="7s" repeatCount="indefinite"/>
      </path>
      
      <!-- Vertical connections -->
      <line x1="-40" y1="-30" x2="-40" y2="30">
        <animate attributeName="stroke-dasharray" values="0,60;60,0" dur="4s" repeatCount="indefinite"/>
      </line>
      <line x1="0" y1="-35" x2="0" y2="35">
        <animate attributeName="stroke-dasharray" values="60,0;0,60" dur="4.5s" repeatCount="indefinite"/>
      </line>
      <line x1="40" y1="-30" x2="40" y2="30">
        <animate attributeName="stroke-dasharray" values="0,60;60,0" dur="5.5s" repeatCount="indefinite"/>
      </line>
    </g>
    
    <!-- Neural nodes -->
    <g fill="url(#codeGradient)" filter="url(#dropShadow)">
      <circle cx="-60" cy="-20" r="4">
        <animate attributeName="r" values="4;6;4" dur="2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="-30" cy="-35" r="3">
        <animate attributeName="r" values="3;5;3" dur="2.5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="0" cy="-20" r="5">
        <animate attributeName="r" values="5;7;5" dur="1.8s" repeatCount="indefinite"/>
      </circle>
      <circle cx="30" cy="-35" r="3">
        <animate attributeName="r" values="3;5;3" dur="2.2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="60" cy="-20" r="4">
        <animate attributeName="r" values="4;6;4" dur="2.8s" repeatCount="indefinite"/>
      </circle>
      
      <!-- Middle row -->
      <circle cx="-50" cy="0" r="4">
        <animate attributeName="r" values="4;6;4" dur="2.3s" repeatCount="indefinite"/>
      </circle>
      <circle cx="0" cy="0" r="6">
        <animate attributeName="r" values="6;8;6" dur="1.5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="50" cy="0" r="4">
        <animate attributeName="r" values="4;6;4" dur="2.7s" repeatCount="indefinite"/>
      </circle>
      
      <!-- Bottom row -->
      <circle cx="-60" cy="20" r="4">
        <animate attributeName="r" values="4;6;4" dur="2.1s" repeatCount="indefinite"/>
      </circle>
      <circle cx="-30" cy="35" r="3">
        <animate attributeName="r" values="3;5;3" dur="2.6s" repeatCount="indefinite"/>
      </circle>
      <circle cx="0" cy="20" r="5">
        <animate attributeName="r" values="5;7;5" dur="1.9s" repeatCount="indefinite"/>
      </circle>
      <circle cx="30" cy="35" r="3">
        <animate attributeName="r" values="3;5;3" dur="2.4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="60" cy="20" r="4">
        <animate attributeName="r" values="4;6;4" dur="2.9s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>
  
  <!-- Floating code symbols (simplified) -->
  <g font-family="'Fira Code', monospace" font-weight="bold" fill="url(#codeGradient)" opacity="0.6">
    <!-- Simple code symbols -->
    <text x="100" y="80" font-size="24" filter="url(#enhancedGlow)">
      &lt;/&gt;
      <animate attributeName="opacity" values="0.6;1;0.6" dur="3s" repeatCount="indefinite"/>
    </text>
    <text x="480" y="220" font-size="24" filter="url(#enhancedGlow)">
      { }
      <animate attributeName="opacity" values="0.6;1;0.6" dur="2.8s" repeatCount="indefinite"/>
    </text>
    <text x="150" y="250" font-size="20" opacity="0.5">
      #
      <animate attributeName="opacity" values="0.5;0.8;0.5" dur="2.5s" repeatCount="indefinite"/>
    </text>
    <text x="450" y="80" font-size="20" opacity="0.5">
      ( )
      <animate attributeName="opacity" values="0.5;0.8;0.5" dur="2.7s" repeatCount="indefinite"/>
    </text>
  </g>
  
  <!-- Orbiting skill icons -->
  <g opacity="0.5">
    <!-- React symbol -->
    <g transform="translate(300, 150)">
      <circle cx="0" cy="-100" r="8" fill="#61DAFB">
        <animateTransform attributeName="transform" type="rotate" values="0 300 150;360 300 150" dur="12s" repeatCount="indefinite"/>
      </circle>
      <text x="-5" y="-95" font-size="10" fill="#61DAFB" font-weight="bold">R</text>
    </g>
    
    <!-- JavaScript symbol -->
    <g transform="translate(300, 150)">
      <circle cx="100" cy="0" r="8" fill="#F7DF1E">
        <animateTransform attributeName="transform" type="rotate" values="0 300 150;360 300 150" dur="15s" repeatCount="indefinite"/>
      </circle>
      <text x="96" y="5" font-size="10" fill="#000" font-weight="bold">JS</text>
    </g>
    
    <!-- TypeScript symbol -->
    <g transform="translate(300, 150)">
      <circle cx="0" cy="100" r="8" fill="#3178C6">
        <animateTransform attributeName="transform" type="rotate" values="0 300 150;360 300 150" dur="18s" repeatCount="indefinite"/>
      </circle>
      <text x="-6" y="105" font-size="10" fill="#fff" font-weight="bold">TS</text>
    </g>
    
    <!-- Node.js symbol -->
    <g transform="translate(300, 150)">
      <circle cx="-100" cy="0" r="8" fill="#339933">
        <animateTransform attributeName="transform" type="rotate" values="0 300 150;360 300 150" dur="10s" repeatCount="indefinite"/>
      </circle>
      <text x="-105" y="5" font-size="9" fill="#fff" font-weight="bold">N</text>
    </g>
  </g>
  
  <!-- Particle effects -->
  <g opacity="0.3">
    <circle cx="100" cy="50" r="2" fill="url(#codeGradient)">
      <animate attributeName="cy" values="50;70;50" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.7;0.3" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="500" cy="250" r="1.5" fill="url(#heroGradient)">
      <animate attributeName="cy" values="250;230;250" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.6;0.3" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="150" cy="200" r="1" fill="url(#codeGradient)">
      <animate attributeName="cx" values="150;170;150" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.5;0.3" dur="6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>