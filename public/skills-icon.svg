<svg width="120" height="120" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradient definitions -->
    <linearGradient id="skillsGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4facfe;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00f2fe;stop-opacity:1" />
    </linearGradient>
    
    <!-- Glow effect -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background circle -->
  <circle cx="60" cy="60" r="55" fill="url(#skillsGradient)" opacity="0.1" stroke="url(#skillsGradient)" stroke-width="2" opacity="0.3"/>
  
  <!-- Central gear/cog representing skills -->
  <g transform="translate(60, 60)" filter="url(#glow)">
    <!-- Outer gear teeth -->
    <g fill="url(#skillsGradient)">
      <rect x="-2" y="-35" width="4" height="8" rx="2"/>
      <rect x="-2" y="27" width="4" height="8" rx="2"/>
      <rect x="27" y="-2" width="8" height="4" rx="2"/>
      <rect x="-35" y="-2" width="8" height="4" rx="2"/>
      
      <!-- Diagonal teeth -->
      <rect x="19" y="-25" width="6" height="4" rx="2" transform="rotate(45)"/>
      <rect x="19" y="21" width="6" height="4" rx="2" transform="rotate(45)"/>
      <rect x="-25" y="-25" width="6" height="4" rx="2" transform="rotate(-45)"/>
      <rect x="-25" y="21" width="6" height="4" rx="2" transform="rotate(-45)"/>
    </g>
    
    <!-- Main gear body -->
    <circle cx="0" cy="0" r="25" fill="url(#skillsGradient)" opacity="0.8"/>
    
    <!-- Inner circle -->
    <circle cx="0" cy="0" r="15" fill="none" stroke="url(#accentGradient)" stroke-width="2"/>
    
    <!-- Center hub -->
    <circle cx="0" cy="0" r="8" fill="url(#accentGradient)"/>
    
    <!-- Spokes -->
    <g stroke="url(#accentGradient)" stroke-width="2" opacity="0.7">
      <line x1="-12" y1="0" x2="12" y2="0"/>
      <line x1="0" y1="-12" x2="0" y2="12"/>
      <line x1="-8.5" y1="-8.5" x2="8.5" y2="8.5"/>
      <line x1="-8.5" y1="8.5" x2="8.5" y2="-8.5"/>
    </g>
    
    <!-- Rotation animation -->
    <animateTransform attributeName="transform" type="rotate" values="0 60 60;360 60 60" dur="10s" repeatCount="indefinite"/>
  </g>
  
  <!-- Code symbols around the gear -->
  <g fill="url(#accentGradient)" opacity="0.6" font-family="monospace" font-size="14" font-weight="bold">
    <!-- HTML tags -->
    <text x="20" y="25" transform="rotate(-15 20 25)">&lt;/&gt;</text>
    <text x="85" y="35" transform="rotate(15 85 35)">{}</text>
    
    <!-- CSS selector -->
    <text x="15" y="95" transform="rotate(-10 15 95)">#</text>
    <text x="95" y="90" transform="rotate(10 95 90)">( )</text>
    
    <!-- JavaScript -->
    <text x="25" y="60" transform="rotate(-45 25 60)">JS</text>
    <text x="85" y="70" transform="rotate(45 85 70)">TS</text>
  </g>
  
  <!-- Orbiting dots representing different technologies -->
  <g opacity="0.5">
    <circle cx="60" cy="15" r="3" fill="url(#accentGradient)">
      <animateTransform attributeName="transform" type="rotate" values="0 60 60;360 60 60" dur="8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="105" cy="60" r="2" fill="url(#skillsGradient)">
      <animateTransform attributeName="transform" type="rotate" values="0 60 60;360 60 60" dur="12s" repeatCount="indefinite"/>
    </circle>
    <circle cx="60" cy="105" r="2.5" fill="url(#accentGradient)">
      <animateTransform attributeName="transform" type="rotate" values="0 60 60;360 60 60" dur="6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>